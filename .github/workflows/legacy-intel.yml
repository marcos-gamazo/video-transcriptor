name: legacy-intel

on:
  push:
    branches: [legacy-intel]
  workflow_dispatch:

jobs:
  test-native:
    name: Tests (arm64)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Versiones
        run: |
          swift --version
          xcodebuild -version
      - name: Instalar toolchain swift.org 6.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'
      - name: Tests nativos arm64
        timeout-minutes: 10
        env:
          SWIFT_TEST_TARGET: arm64-apple-macosx26.0
          TRANSCRIPTOR_SKIP_MEDIA_TESTS: 1
        run: swift --version && swift test 2>&1 | tee tests.log
      - name: Subir log de tests si falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tests-log
          path: tests.log
          if-no-files-found: ignore

  build-x86_64:
    name: Build x86_64 (macOS 11)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Versiones
        run: swift --version
      - name: Cross-compile x86_64 con deployment macOS 11
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          swift build \
            --triple x86_64-apple-macosx11.0 \
            --sdk "$SDK" \
            2>&1 | tee build.log
      - name: Verificar arquitectura x86_64
        run: |
          set -euo pipefail
          BIN=$(swift build --triple x86_64-apple-macosx11.0 \
            --sdk "$(xcrun --sdk macosx --show-sdk-path)" --show-bin-path)/Transcriptor
          file "$BIN"
          lipo -info "$BIN" || true
          echo "-- deployment target --"
          vtool -show-build "$BIN" | head -8 || otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | head -12
      - name: Subir binario como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: transcriptor-x86_64-macos11
          path: .build/x86_64-apple-macosx/debug/Transcriptor
          if-no-files-found: error

  check:
    name: Verificación
    if: always()
    needs: [test-native, build-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Estado de los jobs
        run: |
          test "${{ needs.test-native.result }}" = success && \
          test "${{ needs.build-x86_64.result }}" = success && \
          echo "Todos los jobs correctos" || { echo "Hay fallos"; exit 1; }