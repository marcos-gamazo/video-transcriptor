name: release-intel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-intel
  cancel-in-progress: true

jobs:
  package-and-release:
    name: Empaquetar y publicar release (Intel, macOS 11+)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Instalar toolchain swift.org 6.3
        uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.3.3'
      - name: Empaquetar DMG x86_64 (macOS 11)
        run: |
          chmod +x Scripts/build-release.sh
          export SWIFT_TRIPLE="x86_64-apple-macosx11.0"
          export SWIFT_SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          ./Scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' \
            '**Transcriptor para Mac Intel** (macOS 11 o posterior).' \
            '' \
            '**Instalación**' \
            '1. Descarga `Transcriptor-'"$VERSION"'-Intel.dmg` abajo.' \
            '2. Abre el DMG y arrastra **Transcriptor** a la carpeta Aplicaciones.' \
            '3. La primera vez que lo abras: clic con el botón derecho sobre la app → **Abrir** (el aviso es normal, la descarga está firmada de forma ad-hoc).' \
            '' \
            '**Primera transcripción**' \
            '- Elige el idioma de tus grabaciones (español por defecto).' \
            '- La primera transcripción de un idioma descarga su modelo (≈38 MB) y te lo pregunta antes; se necesita Internet solo esa vez. Las siguientes transcripciones funcionan sin conexión.' \
            '' \
            '**Privacidad**' \
            '- Todo se procesa en tu Mac, con el motor local Vosk. No se sube nada.' \
            > notes.md
          gh release create "$GITHUB_REF_NAME" build/*.dmg \
            --title "Transcriptor $VERSION — Mac Intel (macOS 11+)" \
            --notes-file notes.md \
            || { gh release upload "$GITHUB_REF_NAME" build/*.dmg --clobber; }